<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Price Predictor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
  body {
    background: url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1600&q=80") no-repeat center center fixed;
    background-size: cover;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: -1;
  }
  .card {
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(14px);
    border: none;
    color: white;
  }
  label {
    font-size: 0.9rem;
    font-weight: 600;
    color: white;
  }
  h3 {
    color: #f8f9fa;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
  }
  footer {
    font-size: 0.8rem;
  }
  .result-box {
    background: linear-gradient(135deg, #28a745, #218838);
    color: white;
    padding: 20px;
    border-radius: 15px;
    margin-top: 20px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
  }

  /* 🔥 Extra responsiveness */
  @media (max-width: 768px) {
    h3 { font-size: 1.4rem; }
    .card { padding: 1.2rem; }
    .btn-lg { font-size: 1rem; padding: 10px 25px; }
  }
  @media (max-width: 576px) {
    h3 { font-size: 1.2rem; }
    .form-control, .form-select { font-size: 0.9rem; }
    .btn-lg { width: 100%; } /* Full-width button on small screens */
  }
  </style>
</head>
<body>

  <div class="overlay"></div>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark bg-opacity-75 navbar-expand-lg" data-bs-theme="dark">
   <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">🚗 Car Price Predictor</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
      data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" 
      aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0"> <!-- Align right -->
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/login">Login</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

  <!-- Main Section -->
  <div class="container d-flex justify-content-center align-items-center py-5">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6"> <!-- Auto responsive col sizes -->
      <div class="card shadow-lg rounded-4 p-4">
        <h3 class="text-center mb-4 text-primary fw-bold">Enter Car Details</h3>

        <form method="POST" class="row g-3">
          {% csrf_token %}

          <div class="col-md-6 col-sm-12">
            <label>Year</label>
            <input type="number" name="year" value="{{ year }}" required class="form-control">
          </div>

          <div class="col-md-6 col-sm-12">
            <label>Present Price (Lakhs)</label>
            <input type="number" step="0.01" name="present_price" value="{{ present_price }}" required class="form-control">
          </div>

          <div class="col-md-6 col-sm-12">
            <label>Kms Driven</label>
            <input type="number" name="kms" value="{{ kms }}" required class="form-control">
          </div>

          <div class="col-md-6 col-sm-12">
            <label>Owner</label>
            <input type="number" name="owner" value="{{ owner }}" required class="form-control">
          </div>

          <div class="col-md-6 col-sm-12">
            <label>Fuel Type</label>
            <select name="fuel" class="form-select">
              <option value="Petrol" {% if fuel == "Petrol" %}selected{% endif %}>Petrol</option>
              <option value="Diesel" {% if fuel == "Diesel" %}selected{% endif %}>Diesel</option>
              <option value="CNG" {% if fuel == "CNG" %}selected{% endif %}>CNG</option>
            </select>
          </div>

          <div class="col-md-6 col-sm-12">
            <label>Seller Type</label>
            <select name="seller" class="form-select">
              <option value="Dealer" {% if seller == "Dealer" %}selected{% endif %}>Dealer</option>
              <option value="Individual" {% if seller == "Individual" %}selected{% endif %}>Individual</option>
            </select>
          </div>

          <div class="col-md-6 col-sm-12">
            <label>Transmission</label>
            <select name="trans" class="form-select">
              <option value="Manual" {% if trans == "Manual" %}selected{% endif %}>Manual</option>
              <option value="Automatic" {% if trans == "Automatic" %}selected{% endif %}>Automatic</option>
            </select>
          </div>

          <div class="col-12 text-center">
            <button type="submit" class="btn btn-warning btn-lg px-5">Predict</button>
          </div>
        </form>

        <!-- {% if prediction %}
        <div class="result-box text-center">
          <h5>Predicted Selling Price</h5>
          <p class="display-6 fw-bold">₹ {{ prediction }} Lakhs</p>
        </div>
        {% endif %} -->
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="text-center text-light mt-4">
    &copy; {{ year|default:"2025" }} Car Price Predictor | Powered by Django + ML
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
